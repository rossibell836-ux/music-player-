<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Spool - Local Audio Player</title>   <style>     :root {       --bg-color: #0f0f11;       --card-bg: #18181b;       --accent: #4ade80;       --text-main: #f4f4f5;       --text-muted: #a1a1aa;       --border: #27272a;     }

    * {       box-sizing: border-box;       margin: 0;       padding: 0;       font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;     }

    body {       background-color: var(--bg-color);       color: var(--text-main);       padding: 16px;       padding-bottom: calc(64px + 64px + env(safe-area-inset-bottom));       max-width: 600px;       margin: 0 auto;     }

    header {       margin-bottom: 16px;     }

    h1 {       font-size: 22px;       font-weight: 700;       color: var(--accent);       display: flex;       align-items: center;       gap: 8px;     }

    p.subtitle {       color: var(--text-muted);       font-size: 12px;       margin-top: 2px;     }

    /* Filter & Search Bar */     .filter-bar {       display: flex;       flex-direction: column;       gap: 8px;       margin-bottom: 14px;     }

    .filter-row {       display: flex;       gap: 8px;       align-items: center;     }

    input[type="text"], select {       background: var(--card-bg);       border: 1px solid var(--border);       color: var(--text-main);       padding: 8px 12px;       border-radius: 8px;       font-size: 13px;       flex: 1;     }

    button {       background: var(--card-bg);       border: 1px solid var(--border);       color: var(--text-main);       padding: 8px 12px;       border-radius: 8px;       font-size: 13px;       cursor: pointer;     }

    button:hover {       border-color: var(--text-muted);     }

    /* Selection Toolbar */     .selection-toolbar {       display: none;       background: var(--card-bg);       border: 1px solid var(--border);       padding: 8px 12px;       border-radius: 8px;       margin-bottom: 14px;       gap: 8px;       align-items: center;       flex-wrap: wrap;     }

    .selection-toolbar.active {       display: flex;     }

    .selection-count {       font-weight: 600;       font-size: 13px;       margin-right: auto;     }

    /* Tracks Header */     .tracks-header {       display: flex;       justify-content: space-between;       align-items: center;       margin-bottom: 10px;     }

    .tracks-title-group h2 {       font-size: 16px;       font-weight: 600;     }

    .tracks-title-group span {       font-size: 11px;       color: var(--text-muted);     }

    .shuffle-btn-primary {       background: var(--accent);       color: #000;       font-weight: 600;       border: none;       padding: 6px 12px;     }

    /* Track List */     .track-list {       display: flex;       flex-direction: column;       gap: 6px;     }

    .track-item {       background: var(--card-bg);       border: 1px solid var(--border);       padding: 10px 12px;       border-radius: 8px;       display: flex;       align-items: center;       gap: 12px;     }

    .track-info {       flex: 1;     }

    .track-title {       font-size: 13px;       font-weight: 500;     }

    .track-artist {       font-size: 11px;       color: var(--text-muted);       margin-top: 2px;     }

    /* Mini Player */     .mini-player {       position: fixed;       bottom: 56px;       left: 0;       right: 0;       background: var(--card-bg);       border-top: 1px solid var(--border);       padding: 8px 16px;       display: flex;       align-items: center;       gap: 12px;       z-index: 50;       max-width: 600px;       margin: 0 auto;     }

    .mini-player-thumb {       width: 36px;       height: 36px;       background: var(--border);       border-radius: 4px;     }

    .mini-player-info {       flex: 1;     }

    .mini-player-title {       font-size: 12px;       font-weight: 600;     }

    .mini-player-sub {       font-size: 10px;       color: var(--text-muted);     }

    /* Bottom App Navigation */     .app-nav {       position: fixed;       bottom: 0;       left: 0;       right: 0;       height: 56px;       background: var(--bg-color);       border-top: 1px solid var(--border);       display: flex;       justify-content: space-around;       align-items: center;       z-index: 40;       max-width: 600px;       margin: 0 auto;     }

    .nav-item {       background: none;       border: none;       color: var(--text-muted);       font-size: 10px;       display: flex;       flex-direction: column;       align-items: center;       gap: 2px;       cursor: pointer;     }

    .nav-item.active {       color: var(--accent);     }   </style> </head> <body>

  <header>     <h1> ◎  Spool</h1>     <p class="subtitle">Play music straight from your Files app</p>   </header>

  <div class="filter-bar">     <div class="filter-row">       <input type="text" placeholder="Search your library...">       <select>         <option>Recently added</option>         <option>Alphabetical</option>       </select>     </div>     <div class="filter-row">       <select style="flex: 1;">         <option>All tracks</option>       </select>       <button>★ Favorites</button>       <button id="select-mode-btn">Select</button>     </div>   </div>

  <!-- Selection Toolbar -->   <div class="selection-toolbar" id="selectionToolbar">     <span class="selection-count">0 selected</span>     <button>Select all</button>     <button>★ Favorite</button>     <button>Add to playlist...</button>     <button style="color: #f87171;">Delete</button>   </div>

  <div class="tracks-header">     <div class="tracks-title-group">       <h2>Tracks</h2>       <span>11h 12m total &bull; 828 tracks</span>     </div>     <button class="shuffle-btn-primary">⇄ Shuffle</button>   </div>

  <div class="track-list">     <div class="track-item">       <div class="track-info">         <div class="track-title">Sweet but Psycho</div>         <div class="track-artist">Ava Max &bull; Track 1 of 828</div>       </div>     </div>     <div class="track-item">       <div class="track-info">         <div class="track-title">Celosa</div>         <div class="track-artist">ANGEL22 &bull; Track 2 of 828</div>       </div>     </div>   </div>

  <!-- Mini Player -->   <div class="mini-player">     <div class="mini-player-thumb"></div>     <div class="mini-player-info">       <div class="mini-player-title">Celosa</div>       <div class="mini-player-sub">ANGEL22 &mdash; Track 61 of 828</div>     </div>     <button>▶</button>     <button>⏭</button>   </div>

  <!-- Bottom Navigation -->   <nav class="app-nav">     <button class="nav-item active"> ◎  Songs</button>     <button class="nav-item">💿 Albums</button>     <button class="nav-item">🎤 Artists</button>     <button class="nav-item">☰ Playlists</button>     <button class="nav-item">⚙ Settings</button>   </nav>

  <script>     const selectBtn = document.getElementById('select-mode-btn');     const selectionToolbar = document.getElementById('selectionToolbar');

    selectBtn.addEventListener('click', () => {       selectionToolbar.classList.toggle('active');       const isActive = selectionToolbar.classList.contains('active');       selectBtn.textContent = isActive ? 'Cancel' : 'Select';       selectBtn.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';     });   </script> </body> </html>
