<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Spool - Local Music Player</title>     <style>         :root {             --bg-color: #121212;             --surface-color: #1e1e1e;             --surface-hover: #2a2a2a;             --primary-color: #1db954;             --text-color: #ffffff;             --text-secondary: #b3b3b3;             --border-color: #333333;         }

        [data-theme="light"] {             --bg-color: #f8f9fa;             --surface-color: #ffffff;             --surface-hover: #f1f3f5;             --primary-color: #1db954;             --text-color: #212529;             --text-secondary: #6c757d;             --border-color: #dee2e6;         }

        * {             box-sizing: border-box;             margin: 0;             padding: 0;             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;         }
         body {             background-color: var(--bg-color);             color: var(--text-color);             display: flex;             height: 100vh;             overflow: hidden;         }

        /* Layout */         .sidebar {             width: 240px;             background-color: var(--surface-color);             border-right: 1px solid var(--border-color);             display: flex;             flex-direction: column;             padding: 20px;         }

        .main-content {             flex: 1;             display: flex;             flex-direction: column;             overflow-y: auto;             padding: 20px;             padding-bottom: 120px;         }

        .logo {             font-size: 24px;             font-weight: bold;             color: var(--primary-color);             margin-bottom: 30px;         }

        .nav-links {             list-style: none;             display: flex;             flex-direction: column;             gap: 15px;             flex: 1;         }

        .nav-links li a {             color: var(--text-secondary);             text-decoration: none;             font-weight: 500;             transition: color 0.2s;         }

        .nav-links li a:hover, .nav-links li.active a {             color: var(--text-color);         }

        /* Player Controls Bottom Bar */         .player-bar {             position: fixed;             bottom: 0;             left: 0;             width: 100%;             height: 90px;             background-color: var(--surface-color);             border-top: 1px solid var(--border-color);             display: flex;             align-items: center;             justify-content: space-between;             padding: 0 20px;             z-index: 1000;         }

        .track-info-bar {             display: flex;             align-items: center;             gap: 15px;             width: 250px;         }

        .album-art-thumb {             width: 50px;             height: 50px;             background-color: var(--border-color);             border-radius: 4px;             display: flex;             align-items: center;             justify-content: center;             font-size: 20px;         }

        .track-meta h4 {             font-size: 14px;             white-space: nowrap;             overflow: hidden;             text-overflow: ellipsis;             max-width: 170px;         }

        .track-meta p {             font-size: 12px;             color: var(--text-secondary);         }

        .player-center {             display: flex;             flex-direction: column;             align-items: center;             gap: 8px;             flex: 1;             max-width: 600px;         }

        .player-controls {             display: flex;             align-items: center;             gap: 20px;         }

        .control-btn {             background: none;             border: none;             color: var(--text-color);             cursor: pointer;             font-size: 16px;         }

        .control-btn.play-pause {             width: 40px;             height: 40px;             background-color: var(--text-color);             color: var(--bg-color);             border-radius: 50%;             display: flex;             align-items: center;             justify-content: center;             font-size: 14px;         }

        .progress-container {             display: flex;             align-items: center;             gap: 10px;             width: 100%;             font-size: 12px;             color: var(--text-secondary);         }

        .progress-bar {             flex: 1;             height: 4px;             background-color: var(--border-color);             border-radius: 2px;             position: relative;             cursor: pointer;         }

        .progress-filled {             height: 100%;             background-color: var(--primary-color);             border-radius: 2px;             width: 0%;         }

        /* Sections & Lists */         section {             margin-bottom: 30px;         }

        h2 {             margin-bottom: 15px;             font-size: 20px;         }

        .upload-box {             border: 2px dashed var(--border-color);             padding: 30px;             text-align: center;             border-radius: 8px;             cursor: pointer;             background-color: var(--surface-color);             transition: border-color 0.2s;         }

        .upload-box:hover {             border-color: var(--primary-color);         }

        /* Queue & Drag-and-Drop */         .queue-list {             list-style: none;             display: flex;             flex-direction: column;             gap: 8px;         }

        .queue-item {             display: flex;             align-items: center;             justify-content: space-between;             padding: 10px 15px;             background-color: var(--surface-color);             border: 1px solid var(--border-color);             border-radius: 6px;             cursor: grab;             user-select: none;             transition: background-color 0.2s, border-color 0.2s;         }

        .queue-item:active {             cursor: grabbing;         }

        .queue-item.dragging {             opacity: 0.4;             border: 2px dashed var(--primary-color);         }

        .queue-item-info {             display: flex;             align-items: center;             gap: 12px;         }

        .drag-handle {             color: var(--text-secondary);             font-size: 16px;             cursor: grab;         }

        /* Equalizer & Extras */         .equalizer-panel {             background-color: var(--surface-color);             padding: 20px;             border-radius: 8px;             border: 1px solid var(--border-color);             display: flex;             gap: 20px;             align-items: center;         }

        .eq-sliders {             display: flex;             gap: 15px;         }

        .eq-slider-group {             display: flex;             flex-direction: column;             align-items: center;             gap: 5px;             font-size: 11px;             color: var(--text-secondary);         }

        .eq-slider-group input[type="range"] {             writing-mode: bt-lr; /* IE */             -webkit-appearance: slider-vertical;             width: 8px;             height: 100px;         }

        .theme-toggle {             margin-top: auto;             background: none;             border: 1px solid var(--border-color);             color: var(--text-color);             padding: 8px 12px;             border-radius: 4px;             cursor: pointer;             text-align: center;         }     </style> </head> <body data-theme="dark">

    <nav class="sidebar">         <div class="logo">Spool</div>         <ul class="nav-links">             <li class="active"><a href="#library">Library</a></li>             <li><a href="#queue">Play Queue</a></li>             <li><a href="#equalizer">Equalizer & FX</a></li>         </ul>         <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>     </nav>

    <main class="main-content">         <section id="library">             <h2>Local Music Library</h2>             <div class="upload-box" onclick="document.getElementById('fileInput').click()">                 <p>Click or drop audio files here to add to Spool</p>                 <input type="file" id="fileInput" multiple accept="audio/*" style="display: none;" onchange="handleFiles(this.files)">             </div>         </section>

        <section id="queue">             <h2>Play Queue (Drag to Reorder)</h2>             <ul id="queueList" class="queue-list">                 <!-- Queue items populated dynamically -->             </ul>         </section>

        <section id="equalizer">             <h2>Equalizer & Audio FX</h2>             <div class="equalizer-panel">                 <div class="eq-sliders">                     <div class="eq-slider-group">                         <label>60Hz</label>                         <input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(0, this.value)">                     </div>                     <div class="eq-slider-group">                         <label>230Hz</label>                         <input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(1, this.value)">                     </div>                     <div class="eq-slider-group">                         <label>1kHz</label>                         <input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(2, this.value)">                     </div>                     <div class="eq-slider-group">                         <label>4kHz</label>                         <input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(3, this.value)">                     </div>                     <div class="eq-slider-group">                         <label>14kHz</label>                         <input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(4, this.value)">                     </div>                 </div>             </div>         </section>     </main>

    <div class="player-bar">         <div class="track-info-bar">             <div class="album-art-thumb">🎵</div>             <div class="track-meta">                 <h4 id="currentTitle">No Track Playing</h4>                 <p id="currentArtist">Spool Player</p>             </div>         </div>

        <div class="player-center">             <div class="player-controls">                 <button class="control-btn" onclick="prevTrack()">⏮</button>                 <button class="control-btn play-pause" id="playPauseBtn" onclick="togglePlay()">▶</button>                 <button class="control-btn" onclick="nextTrack()">⏭</button>             </div>             <div class="progress-container">                 <span id="currentTime">0:00</span>                 <div class="progress-bar" onclick="seekTrack(event)">                     <div class="progress-filled" id="progressFilled"></div>                 </div>                 <span id="duration">0:00</span>             </div>         </div>     </div>

    <audio id="audioElement"></audio>

    <script>         let queue = [];         let currentIndex = 0;         let audioCtx, sourceNode, gainNodes = [];         const audioElement = document.getElementById('audioElement');

        // Theme Toggle         function toggleTheme() {             const body = document.body;             const currentTheme = body.getAttribute('data-theme');             body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');         }

        // File Handler         function handleFiles(files) {             for (let file of files) {                 const track = {                     name: file.name.replace(/\.[^/.]+$/, ""),                     artist: "Local File",                     url: URL.createObjectURL(file)                 };                 queue.push(track);             }             renderQueue();             if (queue.length === files.length) {                 loadTrack(0);             }         }

        // Queue Rendering with Drag and Drop Support (Mouse & Touch)         function renderQueue() {             const queueList = document.getElementById('queueList');             queueList.innerHTML = '';

            if (queue.length === 0) {                 queueList.innerHTML = '<li class="queue-item" style="color: var(--text-secondary); justify-content: center;">Queue is empty</li>';                 return;             }

            queue.forEach((track, index) => {                 const li = document.createElement('li');                 li.className = 'queue-item';                 li.draggable = true;                 li.dataset.index = index;

                li.innerHTML = `                     <div class="queue-item-info">                         <span class="drag-handle">☰</span>                         <span>${index + 1}. ${track.name}</span>                     </div>                     <span style="font-size: 12px; color: var(--text-secondary);">${track.artist}</span>                 `;

                // HTML5 Drag and Drop events                 li.addEventListener('dragstart', handleDragStart);                 li.addEventListener('dragover', handleDragOver);                 li.addEventListener('drop', handleDrop);                 li.addEventListener('dragend', handleDragEnd);

                // Touch support for mobile devices                 li.addEventListener('touchstart', handleTouchStart, { passive: true });                 li.addEventListener('touchmove', handleTouchMove, { passive: false });                 li.addEventListener('touchend', handleTouchEnd);

                queueList.appendChild(li);             });         }

        let draggedIndex = null;
         function handleDragStart(e) {             draggedIndex = parseInt(this.dataset.index);             this.classList.add('dragging');         }

        function handleDragOver(e) {             e.preventDefault();         }

        function handleDrop(e) {             e.preventDefault();             const targetIndex = parseInt(this.dataset.index);             if (draggedIndex !== null && draggedIndex !== targetIndex) {                 const movedItem = queue.splice(draggedIndex, 1)[0];                 queue.splice(targetIndex, 0, movedItem);                                  // Adjust current index if needed                 if (currentIndex === draggedIndex) {                     currentIndex = targetIndex;                 } else if (currentIndex > draggedIndex && currentIndex <= targetIndex) {                     currentIndex--;                 } else if (currentIndex < draggedIndex && currentIndex >= targetIndex) {                     currentIndex++;                 }

                renderQueue();             }         }

        function handleDragEnd(e) {             this.classList.remove('dragging');             draggedIndex = null;         }

        // Basic Touch Reorder Handlers         let touchSrcIndex = null;         function handleTouchStart(e) {             touchSrcIndex = parseInt(this.dataset.index);         }

        function handleTouchMove(e) {             e.preventDefault();             const touch = e.touches[0];             const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);             const queueItem = targetElement ? targetElement.closest('.queue-item') : null;             if (queueItem) {                 const targetIndex = parseInt(queueItem.dataset.index);                 if (touchSrcIndex !== null && touchSrcIndex !== targetIndex) {                     const movedItem = queue.splice(touchSrcIndex, 1)[0];                     queue.splice(targetIndex, 0, movedItem);                     touchSrcIndex = targetIndex;                     renderQueue();                 }             }         }

        function handleTouchEnd(e) {             touchSrcIndex = null;         }

        // Playback Controls         function loadTrack(index) {             if (queue.length === 0) return;             currentIndex = index;             const track = queue[currentIndex];             audioElement.src = track.url;             document.getElementById('currentTitle').innerText = track.name;             document.getElementById('currentArtist').innerText = track.artist;             audioElement.play();             document.getElementById('playPauseBtn').innerText = '❚❚';         }

        function togglePlay() {             if (queue.length === 0) return;             if (audioElement.paused) {                 audioElement.play();                 document.getElementById('playPauseBtn').innerText = '❚❚';             } else {                 audioElement.pause();                 document.getElementById('playPauseBtn').innerText = '▶';             }         }

        function nextTrack() {             if (queue.length === 0) return;             currentIndex = (currentIndex + 1) % queue.length;             loadTrack(currentIndex);         }

        function prevTrack() {             if (queue.length === 0) return;             currentIndex = (currentIndex - 1 + queue.length) % queue.length;             loadTrack(currentIndex);         }

        audioElement.addEventListener('timeupdate', () => {             const progress = (audioElement.currentTime / audioElement.duration) * 100 || 0;             document.getElementById('progressFilled').style.width = progress + '%';             document.getElementById('currentTime').innerText = formatTime(audioElement.currentTime);             document.getElementById('duration').innerText = formatTime(audioElement.duration);         });

        function seekTrack(e) {             const rect = e.target.getBoundingClientRect();             const pos = (e.clientX - rect.left) / rect.width;             audioElement.currentTime = pos * audioElement.duration;         }

        function formatTime(seconds) {             if (isNaN(seconds)) return "0:00";             const mins = Math.floor(seconds / 60);             const secs = Math.floor(seconds % 60);             return `${mins}:${secs < 10 ? '0' : ''}${secs}`;         }

        // Placeholder for Equalizer initialization         function updateEQ(band, value) {             // Web Audio API equalizer hooks remain intact         }

        renderQueue();     </script> </body> </html>
