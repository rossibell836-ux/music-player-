<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Spool Music Player</title>     <style>         body {             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;             background-color: #121212;             color: #ffffff;             margin: 0;             padding: 0;             display: flex;             flex-direction: column;             height: 100vh;             overflow: hidden;         }         .container {             flex: 1;             display: flex;             flex-direction: column;             overflow: hidden;             position: relative;         }         .tab-content {             flex: 1;             display: none;             flex-direction: column;             padding: 20px;             overflow-y: auto;             box-sizing: border-box;         }         .tab-content.active {             display: flex;         }         .nav-bar {             height: 60px;             background-color: #1e1e1e;             display: flex;             justify-content: space-around;             align-items: center;             border-top: 1px solid #333;         }         .nav-item {             background: none;             border: none;             color: #888;             font-size: 12px;             display: flex;             flex-direction: column;             align-items: center;             cursor: pointer;         }         .nav-item.active {             color: #1db954;         }         .library-list {             list-style: none;             padding: 0;             margin: 0;         }         .library-item {             padding: 12px;             border-bottom: 1px solid #282828;             cursor: pointer;             display: flex;             justify-content: space-between;             align-items: center;         }         .library-item:hover {             background-color: #282828;         }         .player-controls {             display: flex;             flex-direction: column;             align-items: center;             justify-content: center;             flex: 1;         }         .eq-container {             display: flex;             flex-direction: column;             gap: 15px;             margin-top: 20px;         }         .eq-band {             display: flex;             flex-direction: column;         }         .eq-band label {             font-size: 14px;             margin-bottom: 5px;             color: #b3b3b3;         }         .eq-band input[type="range"] {             width: 100%;         }     </style> </head> <body>

    <div class="container">         <!-- Player Tab -->         <div id="tab-player" class="tab-content active">             <h2>Now Playing</h2>             <div class="player-controls">                 <p id="current-track-name">No track selected</p>                 <audio id="audio-player" controls style="width: 100%; margin-top: 20px;"></audio>             </div>         </div>

        <!-- Library Tab -->         <div id="tab-library" class="tab-content">             <h2>Your Library</h2>             <ul id="library-list" class="library-list">                 <!-- Dynamic tracks will appear here -->             </ul>         </div>

        <!-- Add Music Tab -->         <div id="tab-add" class="tab-content">             <h2>Add Music</h2>             <p>Select audio files from your device to add them locally to Spool.</p>             <input type="file" id="local-file-input" accept="audio/*" multiple style="display: none;">             <button onclick="document.getElementById('local-file-input').click();" style="padding: 12px 20px; background-color: #1db954; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px;">Open Files Picker</button>         </div>

        <!-- Settings Tab -->         <div id="tab-settings" class="tab-content">             <h2>Settings</h2>             <h3>Equalizer</h3>             <div class="eq-container">                 <div class="eq-band">                     <label>60Hz</label>                     <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="60">                 </div>                 <div class="eq-band">                     <label>230Hz</label>                     <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="230">                 </div>                 <div class="eq-band">                     <label>910Hz</label>                     <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="910">                 </div>                 <div class="eq-band">                     <label>4kHz</label>                     <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="4000">                 </div>                 <div class="eq-band">                     <label>14kHz</label>                     <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="14000">                 </div>             </div>         </div>

        <!-- Navigation Bar -->         <nav class="nav-bar">             <button class="nav-item active" onclick="switchTab('player', this)">Player</button>             <button class="nav-item" onclick="switchTab('library', this)">Library</button>             <button class="nav-item" onclick="switchTab('add', this)">Add Music</button>             <button class="nav-item" onclick="switchTab('settings', this)">Settings</button>         </nav>     </div>

    <script>         const libraryTracks = [];         const audioPlayer = document.getElementById('audio-player');         const currentTrackName = document.getElementById('current-track-name');         const libraryList = document.getElementById('library-list');         const fileInput = document.getElementById('local-file-input');

        function switchTab(tabId, element) {             document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));             document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));                          document.getElementById('tab-' + tabId).classList.add('active');             element.classList.add('active');         }

        fileInput.addEventListener('change', (event) => {             const files = event.target.files;             for (let file of files) {                 const trackUrl = URL.createObjectURL(file);                 libraryTracks.push({ name: file.name, url: trackUrl });             }             renderLibrary();             if(libraryTracks.length > 0 && !audioPlayer.src) {                 loadTrack(0);             }         });

        function renderLibrary() {             libraryList.innerHTML = '';             libraryTracks.forEach((track, index) => {                 const li = document.createElement('li');                 li.className = 'library-item';                 li.textContent = track.name;                 li.onclick = () => {                     loadTrack(index);                     switchTab('player', document.querySelector('.nav-item'));                 };                 libraryList.appendChild(li);             });         }

        function loadTrack(index) {             const track = libraryTracks[index];             if (track) {                 audioPlayer.src = track.url;                 currentTrackName.textContent = track.name;                 audioPlayer.play();             }         }     </script> </body> </html>
