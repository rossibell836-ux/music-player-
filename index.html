<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Spool Music Player</title>   <style>     :root {       --bg: #0f1015;       --surface: #181922;       --surface-hover: #222430;       --text: #f0f0f5;       --text-sub: #9496a1;       --accent: #6366f1;       --accent-hover: #4f46e5;       --danger: #ef4444;       --border: #2a2c3d;     }     * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }     body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }     .mono { font-family: monospace; }          /* Layout */     aside { width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }     main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 24px; }          /* Sidebar */     .sidebar-header { padding: 20px; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid var(--border); }     .nav-list { list-style: none; padding: 10px; }     .nav-item { padding: 10px 14px; border-radius: 6px; cursor: pointer; color: var(--text-sub); margin-bottom: 4px; }     .nav-item:hover, .nav-item.active { background: var(--surface-hover); color: var(--text); }          /* Now Playing & Queue */     .now-playing-container { display: flex; gap: 24px; margin-bottom: 24px; }     .player-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; flex: 1; }     .queue-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 350px; display: flex; flex-direction: column; max-height: 400px; }     .queue-header { font-weight: bold; margin-bottom: 12px; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }          .queue-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }     .queue-item {        background: var(--bg); border: 1px solid var(--border); padding: 10px 12px; border-radius: 6px;        display: flex; justify-content: space-between; align-items: center; cursor: grab; user-select: none;       transition: background 0.15s, border-color 0.15s;     }     .queue-item:active { cursor: grabbing; }     .queue-item.dragging { opacity: 0.4; background: var(--surface-hover); }     .queue-item.drag-over { border-color: var(--accent); }          /* Buttons & Modals */     .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; }     .btn-ghost:hover { background: var(--surface-hover); }          .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }     .overlay[hidden] { display: none; }     .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 500px; max-height: 80vh; display: flex; flex-direction: column; padding: 24px; }     .dupe-group { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; padding: 12px; background: var(--bg); }     .dupe-group-header { display: flex; justify-content: space-between; margin-bottom: 8px; }     .dupe-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); }     .dupe-row-keep-badge { background: rgba(99, 102, 241, 0.2); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }   </style> </head> <body>

  <aside>     <div class="sidebar-header">Spool</div>     <ul class="nav-list">       <li class="nav-item active">Library</li>       <li class="nav-item" id="btnOpenDupes">Find Duplicates</li>     </ul>   </aside>

  <main>     <div class="now-playing-container">       <div class="player-card">         <h2>Now Playing</h2>         <p id="currentTrackTitle" style="margin-top: 12px; font-size: 1.1rem; font-weight: bold;">No Track Playing</p>         <p id="currentTrackArtist" style="color: var(--text-sub); font-size: 0.9rem;">Select a track to start</p>       </div>              <div class="queue-card">         <div class="queue-header">           <span>Play Queue</span>           <span id="queueCount" class="mono" style="font-size: 0.75rem; color: var(--text-sub);">0 items</span>         </div>         <div class="queue-list" id="queueList">           <!-- Drag-and-Drop Queue items render here -->         </div>       </div>     </div>

    <!-- Library section placeholder -->     <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px;">       <h3>Library Tracks</h3>       <div id="libraryList" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">         <!-- Dynamic tracks populated via script -->       </div>     </div>   </main>

  <!-- Duplicates Modal -->   <div class="overlay" id="dupesOverlay" hidden>     <div class="dialog" id="dupesDialog" role="dialog" aria-modal="true">       <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">         <h3>Duplicate Management</h3>         <button class="btn-ghost" id="btnCloseDupes">Close</button>       </div>       <div id="dupesSummary" style="margin-bottom: 12px; font-size: 0.85rem; color: var(--text-sub);"></div>       <div id="dupesList" style="overflow-y: auto; flex: 1;"></div>     </div>   </div>

  <script>     // Mock State & App Logic     let tracks = [       { id: '1', name: 'Song Alpha', tagArtist: 'Artist A', size: 4500000, duration: 210, addedAt: Date.now() - 10000 },       { id: '2', name: 'Song Beta', tagArtist: 'Artist B', size: 5200000, duration: 185, addedAt: Date.now() - 8000 },       { id: '3', name: 'Song Gamma', tagArtist: 'Artist C', size: 3800000, duration: 240, addedAt: Date.now() - 5000 }     ];     let playQueue = ['1', '2', '3'];     let currentQueueIndex = 0;

    const queueListEl = document.getElementById('queueList');     const queueCountEl = document.getElementById('queueCount');     const libraryListEl = document.getElementById('libraryList');     const currentTitleEl = document.getElementById('currentTrackTitle');     const currentArtistEl = document.getElementById('currentTrackArtist');

    function renderLibrary() {       libraryListEl.innerHTML = '';       tracks.forEach(t => {         const row = document.createElement('div');         row.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--bg); border-radius: 6px;';         row.innerHTML = `<div><strong>${t.name}</strong> <span style="color:var(--text-sub)">(${t.tagArtist})</span></div>`;         const playBtn = document.createElement('button');         playBtn.className = 'btn-ghost';         playBtn.textContent = 'Play / Queue';         playBtn.onclick = () => {           playQueue.push(t.id);           renderQueue();         };         row.appendChild(playBtn);         libraryListEl.appendChild(row);       });     }

    // --- Drag-and-Drop Queue Implementation ---     let draggedIndex = null;

    function renderQueue() {       queueListEl.innerHTML = '';       queueCountEl.textContent = playQueue.length + ' items';

      playQueue.forEach((trackId, index) => {         const track = tracks.find(t => t.id === trackId);         if (!track) return;

        const item = document.createElement('div');         item.className = 'queue-item';         item.draggable = true;         item.dataset.index = index;

        item.innerHTML = `           <div>             <div style="font-weight: 500; font-size: 0.85rem;">${track.name}</div>             <div style="font-size: 0.75rem; color: var(--text-sub);">${track.tagArtist}</div>           </div>           <span style="font-size: 0.75rem; color: var(--text-sub);">☰</span>         `;

        // Desktop Mouse Drag Events         item.addEventListener('dragstart', (e) => {           draggedIndex = index;           e.dataTransfer.effectAllowed = 'move';           item.classList.add('dragging');         });

        item.addEventListener('dragend', () => {           item.classList.remove('dragging');           document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('drag-over'));         });

        item.addEventListener('dragover', (e) => {           e.preventDefault();           e.dataTransfer.dropEffect = 'move';           item.classList.add('drag-over');         });

        item.addEventListener('dragleave', () => {           item.classList.remove('drag-over');         });

        item.addEventListener('drop', (e) => {           e.preventDefault();           if (draggedIndex === null || draggedIndex === index) return;                      // Reorder queue array           const movedItem = playQueue.splice(draggedIndex, 1)[0];           playQueue.splice(index, 0, movedItem);                      draggedIndex = null;           renderQueue();         });

        // Touch Drag Support (Mobile / iPhone)         let touchStartY = 0;         item.addEventListener('touchstart', (e) => {           draggedIndex = index;           touchStartY = e.touches[0].clientY;           item.classList.add('dragging');         }, {passive: true});

        item.addEventListener('touchmove', (e) => {           if (draggedIndex === null) return;           const currentY = e.touches[0].clientY;           const diff = currentY - touchStartY;                      // Simple rough threshold check for swapping items dynamically on touch           if (Math.abs(diff) > 40) {             const targetIndex = diff > 0 ? Math.min(playQueue.length - 1, draggedIndex + 1) : Math.max(0, draggedIndex - 1);             if (targetIndex !== draggedIndex) {               const temp = playQueue[draggedIndex];               playQueue[draggedIndex] = playQueue[targetIndex];               playQueue[targetIndex] = temp;               draggedIndex = targetIndex;               touchStartY = currentY;               renderQueue();             }           }         }, {passive: true});

        item.addEventListener('touchend', () => {           draggedIndex = null;           item.classList.remove('dragging');           renderQueue();         });

        queueListEl.appendChild(item);       });

      updateNowPlayingInfo();     }

    function updateNowPlayingInfo() {       if (playQueue.length > 0 && currentQueueIndex < playQueue.length) {         const activeTrack = tracks.find(t => t.id === playQueue[currentQueueIndex]);         if (activeTrack) {           currentTitleEl.textContent = activeTrack.name;           currentArtistEl.textContent = activeTrack.tagArtist;           return;         }       }       currentTitleEl.textContent = 'No Track Playing';       currentArtistEl.textContent = 'Queue is empty';     }

    // --- Duplicate Modal Logic ---     const dupesOverlay = document.getElementById('dupesOverlay');     const dupesDialog = document.getElementById('dupesDialog');     const btnOpenDupes = document.getElementById('btnOpenDupes');     const btnCloseDupes = document.getElementById('btnCloseDupes');     const dupesList = document.getElementById('dupesList');     const dupesSummary = document.getElementById('dupesSummary');

    function pickRecommendedKeep(group) {       return group[0];     }

    function renderDupesList() {       dupesList.innerHTML = '';       const groups = [tracks]; // Mock grouped check       const extraCount = 0;       dupesSummary.textContent = 'Found 0 group(s) with 0 duplicate copy/copies total.';     }

    function openDupes() {       renderDupesList();       dupesOverlay.hidden = false;     }

    function closeDupes() {       dupesOverlay.hidden = true;     }

    btnOpenDupes.addEventListener('click', openDupes);     btnCloseDupes.addEventListener('click', closeDupes);

    // Initial load     renderLibrary();     renderQueue();   </script> </body> </html>
